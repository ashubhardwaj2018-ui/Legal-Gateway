# /etc/nginx/conf.d/legalfilingindia.conf
#
# This is the complete production Nginx config for legalfilingindia.com.
# It is based on the configuration documented in DEPLOYMENT.md §8, with
# one additive change: two bot-detection maps and a pSEO location block
# that routes search-engine crawlers to the SSR prerender endpoint only
# for valid pSEO URLs (/:serviceSlug/:locationSlug) — without intercepting
# reserved route prefixes that the React SPA also handles as two-segment paths.
#
# Reserved two-segment public routes that must NOT be SSR-routed:
#   /blog/:slug          /company/:slug
#   /state/:stateSlug    /portal/dashboard
#   /services/:id        /public/doc/:token  (three-segment, excluded by regex)
#
# Deploy:
#   sudo cp deploy/nginx/legalfilingindia.conf /etc/nginx/conf.d/legalfilingindia.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify bot routing (valid pSEO URL → SSR):
#   curl -A "Googlebot" https://legalfilingindia.com/gst-registration/delhi-dl
#   # Expect: 10 KB+ HTML with <title>, <h1>, application/ld+json
#
# Verify reserved routes not affected (bot UA → SPA, not SSR):
#   curl -A "Googlebot" https://legalfilingindia.com/blog/some-post
#   curl -A "Googlebot" https://legalfilingindia.com/company/U12345MH2020
#   curl -A "Googlebot" https://legalfilingindia.com/state/maharashtra
#   # Expect: React SPA shell (index.html), NOT a 404/noindex from SSR
#
# Verify human routing (no bot UA → SPA):
#   curl https://legalfilingindia.com/gst-registration/delhi-dl
#   # Expect: React SPA shell
#

# ── Bot-detection map (http{} context) ───────────────────────────────────────
#
# $is_seo_bot = 1 for major search-engine crawlers, 0 for regular users.
#
map $http_user_agent $is_seo_bot {
    default                                                                          0;
    ~*(Googlebot|bingbot|Slurp|DuckDuckBot|Baiduspider|YandexBot|Sogou|facebot|ia_archiver) 1;
}

# ── Reserved-prefix map (http{} context) ─────────────────────────────────────
#
# $is_reserved_prefix = 1 when the first URL path segment belongs to a
# non-pSEO route that also matches the two-segment pattern /foo/bar.
# This prevents the SSR rewrite from intercepting:
#   /blog/:slug          → BlogPost component
#   /company/:slug       → CompanyDetail component
#   /state/:stateSlug    → StateHub component
#   /portal/dashboard    → PortalDashboard component
#   /services/:id        → ServiceCategory component
#   /public/:anything    → public document viewer
#   /admin/:anything     → admin panel
#
map $uri $is_reserved_prefix {
    default       0;
    ~^/blog/      1;
    ~^/company/   1;
    ~^/state/     1;
    ~^/portal/    1;
    ~^/services/  1;
    ~^/public/    1;
    ~^/admin/     1;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name legalfilingindia.com www.legalfilingindia.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name legalfilingindia.com www.legalfilingindia.com;

    # SSL — obtain with: sudo certbot --nginx -d legalfilingindia.com
    ssl_certificate     /etc/letsencrypt/live/legalfilingindia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legalfilingindia.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── Uploads (served directly by Nginx) ────────────────────────────────
    location /uploads/ {
        alias /var/www/legalfilingindia/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy ─────────────────────────────────────────────────────────
    #
    # Bare proxy_pass (no URI path) is required in a prefix location.
    # This block also handles rewrites from the pSEO block below:
    # when a bot hits a valid /:serviceSlug/:locationSlug the request is
    # rewritten to /api/ssr/$1/$2 (last flag), Nginx restarts matching, and
    # this location proxies the result to Express.
    #
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # ── Long-cache for hashed static assets ───────────────────────────────
    #
    # Matched before the pSEO block; asset paths always contain a file
    # extension so they never match the two-slug pSEO pattern below.
    #
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        root   /var/www/legalfilingindia/artifacts/lawfirm/dist/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── pSEO pages: /:serviceSlug/:locationSlug ────────────────────────────
    #
    # Pattern: exactly two lowercase-alphanumeric-or-dash segments.
    #
    # The combined variable $is_seo_bot$is_reserved_prefix equals "10" only
    # when the request is from a bot ($is_seo_bot=1) AND the first segment is
    # NOT a reserved route prefix ($is_reserved_prefix=0).  Comparing the
    # concatenated string is the standard Nginx technique for AND logic in `if`.
    #
    # When "10": rewrite ... last stops current-location processing and restarts
    #   Nginx location matching; the /api/ prefix location above then proxies to
    #   Express. proxy_pass with a URI is invalid inside `if` and regex locations;
    #   the rewrite+last pattern is the correct alternative.
    #   Express returns full SEO HTML with:
    #     Cache-Control: public, max-age=3600, stale-while-revalidate=86400
    #   Nginx passes that header through to the crawler unmodified.
    #
    # Otherwise: try_files falls through to /index.html (React SPA bootstrap).
    #   This covers: all regular users, bots on reserved routes (/blog/:slug etc.).
    #
    location ~* "^/([a-z0-9-]+)/([a-z0-9-]+)$" {
        if ($is_seo_bot$is_reserved_prefix = "10") {
            rewrite ^/([a-z0-9-]+)/([a-z0-9-]+)$ /api/ssr/$1/$2 last;
        }
        root  /var/www/legalfilingindia/artifacts/lawfirm/dist/public;
        try_files $uri /index.html;
    }

    # ── React SPA catch-all ────────────────────────────────────────────────
    location / {
        root  /var/www/legalfilingindia/artifacts/lawfirm/dist/public;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
