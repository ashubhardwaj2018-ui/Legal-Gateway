openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Vakil & Co. Legal Services
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: consultations
  - name: contacts
  - name: newsletter
  - name: stats
  - name: admin-seo
  - name: admin-services
  - name: admin-quotations
  - name: admin-company-data
  - name: admin-lawyers
  - name: admin-settings

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /consultations:
    post:
      operationId: createConsultation
      tags: [consultations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConsultationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listConsultations
      tags: [consultations]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Consultation"

  /consultations/{id}:
    patch:
      operationId: updateConsultation
      tags: [consultations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsultationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consultation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contacts:
    post:
      operationId: createContact
      tags: [contacts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listContacts
      tags: [contacts]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"

  /contacts/{id}:
    patch:
      operationId: updateContact
      tags: [contacts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /newsletter:
    post:
      operationId: subscribeNewsletter
      tags: [newsletter]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscribeNewsletterBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsletterSubscriber"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: listNewsletterSubscribers
      tags: [newsletter]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsletterSubscriber"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"

  # ─── Admin: SEO ────────────────────────────────────────────────────────────

  /admin/seo:
    get:
      operationId: listSeoSettings
      tags: [admin-seo]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SeoSetting"

  /admin/seo/{page}:
    get:
      operationId: getSeoSetting
      tags: [admin-seo]
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoSetting"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertSeoSetting
      tags: [admin-seo]
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSeoSettingBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeoSetting"

  # ─── Admin: Services Config ─────────────────────────────────────────────────

  /admin/services-config:
    get:
      operationId: listServicesConfig
      tags: [admin-services]
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceConfig"
    post:
      operationId: createServiceConfig
      tags: [admin-services]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceConfigBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceConfig"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/services-config/{id}:
    patch:
      operationId: updateServiceConfig
      tags: [admin-services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceConfigBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceConfig"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteServiceConfig
      tags: [admin-services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin: Quotations ──────────────────────────────────────────────────────

  /admin/quotations:
    get:
      operationId: listQuotations
      tags: [admin-quotations]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quotation"
    post:
      operationId: createQuotation
      tags: [admin-quotations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuotationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/quotations/{id}:
    get:
      operationId: getQuotation
      tags: [admin-quotations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateQuotation
      tags: [admin-quotations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuotationBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/quotations/{id}/send:
    post:
      operationId: sendQuotation
      tags: [admin-quotations]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quotation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin: Company Data ────────────────────────────────────────────────────

  /admin/company-data:
    get:
      operationId: listCompanyData
      tags: [admin-company-data]
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDataList"
    post:
      operationId: createCompanyRecord
      tags: [admin-company-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRecordBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyRecord"

  /admin/company-data/bulk-import:
    post:
      operationId: bulkImportCompanyData
      tags: [admin-company-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportBody"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"

  /admin/company-data/{id}:
    delete:
      operationId: deleteCompanyRecord
      tags: [admin-company-data]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin: Lawyer Profiles ─────────────────────────────────────────────────

  /admin/lawyer-profiles:
    get:
      operationId: listLawyerProfiles
      tags: [admin-lawyers]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LawyerProfile"
    post:
      operationId: createLawyerProfile
      tags: [admin-lawyers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLawyerProfileBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LawyerProfile"

  /admin/lawyer-profiles/{id}:
    patch:
      operationId: updateLawyerProfile
      tags: [admin-lawyers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLawyerProfileBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LawyerProfile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLawyerProfile
      tags: [admin-lawyers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ─── Admin: Settings ────────────────────────────────────────────────────────

  /admin/settings:
    get:
      operationId: listSettings
      tags: [admin-settings]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteSetting"
    put:
      operationId: updateSettings
      tags: [admin-settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteSetting"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    # ── Consultation ──────────────────────────────────────────────────────────

    CreateConsultationBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        serviceCategory:
          type: string
        serviceInterest:
          type: string
        message:
          type: ["string", "null"]
        preferredDate:
          type: ["string", "null"]
      required:
        - name
        - email
        - phone
        - serviceCategory
        - serviceInterest

    UpdateConsultationBody:
      type: object
      properties:
        status:
          type: string
        notes:
          type: ["string", "null"]

    Consultation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        serviceCategory:
          type: string
        serviceInterest:
          type: string
        message:
          type: ["string", "null"]
        preferredDate:
          type: ["string", "null"]
        status:
          type: string
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - email
        - phone
        - serviceCategory
        - serviceInterest
        - status
        - createdAt
        - updatedAt

    # ── Contact ───────────────────────────────────────────────────────────────

    CreateContactBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        subject:
          type: string
        message:
          type: string
      required:
        - name
        - email
        - subject
        - message

    UpdateContactBody:
      type: object
      properties:
        status:
          type: string

    Contact:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: ["string", "null"]
        subject:
          type: string
        message:
          type: string
        status:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - name
        - email
        - subject
        - message
        - status
        - createdAt
        - updatedAt

    # ── Newsletter ────────────────────────────────────────────────────────────

    SubscribeNewsletterBody:
      type: object
      properties:
        email:
          type: string
        name:
          type: ["string", "null"]
      required:
        - email

    NewsletterSubscriber:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: ["string", "null"]
        subscribedAt:
          type: string
      required:
        - id
        - email
        - subscribedAt

    # ── Stats ─────────────────────────────────────────────────────────────────

    SiteStats:
      type: object
      properties:
        totalConsultations:
          type: integer
        totalContacts:
          type: integer
        totalSubscribers:
          type: integer
        pendingConsultations:
          type: integer
        totalQuotations:
          type: integer
        totalCompanyRecords:
          type: integer
      required:
        - totalConsultations
        - totalContacts
        - totalSubscribers
        - pendingConsultations
        - totalQuotations
        - totalCompanyRecords

    # ── SEO Settings ──────────────────────────────────────────────────────────

    SeoSetting:
      type: object
      properties:
        id:
          type: integer
        page:
          type: string
        title:
          type: string
        description:
          type: string
        keywords:
          type: ["string", "null"]
        ogTitle:
          type: ["string", "null"]
        ogDescription:
          type: ["string", "null"]
        ogImage:
          type: ["string", "null"]
        robots:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - page
        - title
        - description
        - robots
        - updatedAt

    UpsertSeoSettingBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        keywords:
          type: ["string", "null"]
        ogTitle:
          type: ["string", "null"]
        ogDescription:
          type: ["string", "null"]
        ogImage:
          type: ["string", "null"]
        robots:
          type: string
      required:
        - title
        - description

    # ── Services Config ───────────────────────────────────────────────────────

    ServiceConfig:
      type: object
      properties:
        id:
          type: integer
        categoryId:
          type: string
        serviceName:
          type: string
        displayName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        basePrice:
          type: ["integer", "null"]
        priceDisplay:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        isPopular:
          type: boolean
        isActive:
          type: boolean
        updatedAt:
          type: string
      required:
        - id
        - categoryId
        - serviceName
        - isPopular
        - isActive
        - updatedAt

    CreateServiceConfigBody:
      type: object
      properties:
        categoryId:
          type: string
        serviceName:
          type: string
        displayName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        basePrice:
          type: ["integer", "null"]
        priceDisplay:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        isPopular:
          type: boolean
        isActive:
          type: boolean
      required:
        - categoryId
        - serviceName

    UpdateServiceConfigBody:
      type: object
      properties:
        displayName:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        basePrice:
          type: ["integer", "null"]
        priceDisplay:
          type: ["string", "null"]
        duration:
          type: ["string", "null"]
        isPopular:
          type: boolean
        isActive:
          type: boolean

    # ── Quotations ────────────────────────────────────────────────────────────

    QuotationItem:
      type: object
      properties:
        serviceName:
          type: string
        description:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: integer
        total:
          type: integer
      required:
        - serviceName
        - description
        - quantity
        - unitPrice
        - total

    Quotation:
      type: object
      properties:
        id:
          type: integer
        quotationNumber:
          type: string
        clientName:
          type: string
        clientEmail:
          type: string
        clientPhone:
          type: ["string", "null"]
        clientCompany:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuotationItem"
        subtotal:
          type: integer
        taxPercent:
          type: integer
        taxAmount:
          type: integer
        total:
          type: integer
        notes:
          type: ["string", "null"]
        validityDays:
          type: integer
        status:
          type: string
        sentAt:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - quotationNumber
        - clientName
        - clientEmail
        - items
        - subtotal
        - taxPercent
        - taxAmount
        - total
        - validityDays
        - status
        - createdAt
        - updatedAt

    CreateQuotationBody:
      type: object
      properties:
        clientName:
          type: string
        clientEmail:
          type: string
        clientPhone:
          type: ["string", "null"]
        clientCompany:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuotationItem"
        taxPercent:
          type: integer
        notes:
          type: ["string", "null"]
        validityDays:
          type: integer
      required:
        - clientName
        - clientEmail
        - items
        - validityDays

    UpdateQuotationBody:
      type: object
      properties:
        clientName:
          type: string
        clientEmail:
          type: string
        clientPhone:
          type: ["string", "null"]
        clientCompany:
          type: ["string", "null"]
        items:
          type: array
          items:
            $ref: "#/components/schemas/QuotationItem"
        taxPercent:
          type: integer
        notes:
          type: ["string", "null"]
        validityDays:
          type: integer
        status:
          type: string

    # ── Company Data ──────────────────────────────────────────────────────────

    CompanyRecord:
      type: object
      properties:
        id:
          type: integer
        companyName:
          type: string
        cin:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        state:
          type: ["string", "null"]
        dateOfIncorporation:
          type: ["string", "null"]
        authorizedCapital:
          type: ["string", "null"]
        paidUpCapital:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        registeredAddress:
          type: ["string", "null"]
        companyStatus:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - companyName
        - createdAt

    CompanyDataList:
      type: object
      properties:
